<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fan Control</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            padding: 20px;
        }
        h1 { color: #00d9ff; margin-bottom: 10px; }
        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff4444;
            animation: pulse 2s infinite;
        }
        .status-dot.connected { background: #44ff44; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
            gap: 20px;
        }
        @media (max-width: 480px) {
            .cards {
                grid-template-columns: 1fr;
            }
        }
        .gpu-card {
            background: #16213e;
            border-radius: 12px;
            padding: 20px;
            border: 2px solid #0f3460;
        }
        .gpu-card.offline { border-color: #ff4444; opacity: 0.7; }
        .gpu-card.online { border-color: #44ff44; }
        .gpu-name-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }
        .gpu-display-name {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
        }
        .gpu-display-name.empty { color: #666; font-style: italic; }
        .gpu-status-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 10px;
        }
        .gpu-status-badge.free {
            background: #2a4a2a;
            color: #66ff66;
            border: 1px solid #44aa44;
        }
        .gpu-status-badge.vm {
            background: #2a3a5a;
            color: #66aaff;
            border: 1px solid #4477aa;
        }
        .gpu-status-badge.vm.running {
            background: #3a2a4a;
            color: #ff66ff;
            border: 1px solid #aa44aa;
        }
        .gpu-status-badge.offline {
            background: #4a2a2a;
            color: #ff6666;
            border: 1px solid #aa4444;
        }
        .edit-name-btn {
            background: transparent;
            border: 1px solid #555;
            color: #888;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .edit-name-btn:hover {
            border-color: #00d9ff;
            color: #00d9ff;
        }
        .name-input {
            background: #1a1a2e;
            border: 1px solid #00d9ff;
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 16px;
            width: 200px;
        }
        .gpu-uuid {
            font-family: monospace;
            font-size: 13px;
            color: #888;
            margin-bottom: 15px;
            word-break: break-all;
        }
        .temp-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }
        .temp-item { text-align: center; }
        .temp-label { font-size: 12px; color: #888; margin-bottom: 5px; }
        .temp-value { font-size: 32px; font-weight: bold; }
        .temp-value.cool { color: #44ff44; }
        .temp-value.warm { color: #ffff44; }
        .temp-value.hot { color: #ff4444; }
        .temp-unit { font-size: 16px; color: #888; }
        .info-row {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #0f3460;
            font-size: 13px;
        }
        .info-item { display: flex; gap: 5px; }
        .info-label { color: #888; }
        .info-value { color: #fff; }
        .last-seen {
            margin-top: 15px;
            font-size: 11px;
            color: #666;
            text-align: right;
        }
        .no-data { text-align: center; padding: 40px; color: #666; }

        /* ==================== HEADER BAR ==================== */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header-title {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .case-fans-pwm-display {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #16213e;
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid #0f3460;
        }
        .case-fans-pwm-label { color: #888; font-size: 14px; }
        .case-fans-pwm-value {
            font-size: 28px;
            font-weight: bold;
            color: #00d9ff;
        }
        .case-fans-pwm-unit { color: #888; font-size: 14px; }

        /* Emergency Banner */
        .emergency-banner {
            background: linear-gradient(90deg, #ff4444, #ff6b6b);
            color: #fff;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-weight: bold;
            display: none;
            animation: emergency-pulse 1s infinite;
            text-align: center;
        }
        .emergency-banner.active { display: block; }
        @keyframes emergency-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        /* ==================== CPU CARD (same size as GPU cards) ==================== */
        .gpu-card.cpu-card {
            border-color: #ff9800;
            box-shadow: 0 4px 20px rgba(255, 152, 0, 0.15);
        }
        .cpu-title {
            font-size: 18px;
            font-weight: bold;
            color: #ff9800;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .cpu-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            background: #ff9800;
            color: #1a1a2e;
        }
        .cpu-subtitle {
            font-family: monospace;
            font-size: 13px;
            color: #888;
            margin-bottom: 15px;
        }
        .cpu-stats-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #0f3460;
            font-size: 14px;
        }
        .cpu-stat-item { color: #888; }
        .cpu-stat-value {
            color: #ff9800;
            font-weight: bold;
            font-size: 18px;
        }

        /* CPU Socket Temps List - compact */
        .cpu-socket-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 15px;
        }
        .cpu-socket-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 10px;
            background: rgba(255, 152, 0, 0.1);
            border-radius: 4px;
            border-left: 3px solid #ff9800;
            font-size: 13px;
        }
        .cpu-socket-name { color: #aaa; }
        .cpu-socket-temp { font-weight: bold; color: #ff9800; }

        /* Profile Editor */
        /* Profile Toggle */
        .profile-toggle {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #0f3460;
        }
        .profile-toggle-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: transparent;
            border: none;
            color: #00d9ff;
            font-size: 14px;
            cursor: pointer;
            padding: 0;
            transition: color 0.2s;
            width: 100%;
        }
        .profile-toggle-btn:hover {
            color: #44e5ff;
        }
        .profile-toggle-btn .profile-coords {
            margin-left: auto;
            color: #fff;
            font-size: 13px;
            font-family: monospace;
            background: #0f3460;
            padding: 3px 10px;
            border-radius: 4px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .profile-toggle-btn .profile-coords.visible {
            opacity: 1;
        }
        .profile-toggle-icon {
            font-size: 12px;
            transition: transform 0.2s;
        }
        .profile-toggle-icon.expanded {
            transform: rotate(90deg);
        }
        .profile-section {
            margin-top: 10px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            display: none;
        }
        .profile-section.expanded {
            display: block;
        }
        .profile-canvas-container {
            position: relative;
            width: 100%;
            margin-bottom: 10px;
        }
        .profile-canvas {
            background: #1a1a2e;
            border-radius: 8px;
            cursor: crosshair;
            width: 100%;
            height: auto;
            touch-action: none;
            display: block;
        }
        .profile-btn {
            background: #00d9ff;
            color: #1a1a2e;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .profile-btn:hover {
            background: #44e5ff;
        }
        .profile-btn.clear-btn {
            background: #ff6b6b;
            color: #fff;
        }
        .profile-btn.clear-btn:hover {
            background: #ff8787;
        }
        .profile-controls {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            justify-content: flex-end;
        }
        .profile-status {
            font-size: 11px;
            color: #888;
        }
        .profile-status.saved { color: #44ff44; }
        
        /* Confirm Dialog */
        .confirm-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }
        .confirm-overlay.visible {
            opacity: 1;
            visibility: visible;
        }
        .confirm-dialog {
            background: #16213e;
            border-radius: 12px;
            padding: 25px;
            max-width: 350px;
            text-align: center;
            border: 2px solid #0f3460;
        }
        .confirm-dialog h3 {
            color: #fff;
            margin-bottom: 15px;
        }
        .confirm-dialog p {
            color: #aaa;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .confirm-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .confirm-btn {
            padding: 10px 25px;
            border-radius: 6px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .confirm-btn.yes {
            background: #00d9ff;
            color: #1a1a2e;
        }
        .confirm-btn.yes:hover { background: #44e5ff; }
        .confirm-btn.no {
            background: #333;
            color: #fff;
        }
        .confirm-btn.no:hover { background: #444; }
        .confirm-btn.danger {
            background: #ff4444;
            color: #fff;
        }
        .confirm-btn.danger:hover { background: #ff6666; }

        /* Make gpuCards container transparent for grid */
        #gpuCards {
            display: contents;
        }
        #gpuCards .no-data {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: #666;
            background: #16213e;
            border-radius: 12px;
            border: 2px dashed #0f3460;
        }

        /* Mobile Responsive */
        @media (max-width: 600px) {
            body { padding: 10px; }
            h1 { font-size: 20px; }
            .header-bar {
                flex-direction: column;
                align-items: flex-start;
            }
            .header-title { font-size: 16px; }
            .case-fans-pwm-value { font-size: 24px; }
            .cpu-stat-value { font-size: 16px; }
            .gpu-card { padding: 15px; }
            .temp-value { font-size: 24px; }
            .temp-unit { font-size: 12px; }
            .profile-section { padding: 10px; }
        }
    </style>
</head>
<body>
    <h1>Fan Control</h1>
    <div class="status">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">Connecting...</span>
    </div>

    <!-- Header Bar -->
    <div class="header-bar">
        <span class="header-title">System Thermal Control</span>
        <div class="case-fans-pwm-display">
            <span class="case-fans-pwm-label">Case Fans:</span>
            <span class="case-fans-pwm-value" id="caseFansPwm">--</span>
            <span class="case-fans-pwm-unit">%</span>
        </div>
    </div>

    <!-- Emergency Banner -->
    <div class="emergency-banner" id="emergencyBanner">
        EMERGENCY MODE: <span id="emergencyReason">-</span>
    </div>
    <div class="cards">
        <!-- CPU Card (same size as GPU cards) -->
        <div class="gpu-card cpu-card" data-uuid="cpu">
            <div class="cpu-title">
                CPU Group
                <span class="cpu-badge">HOST</span>
            </div>
            <div class="cpu-subtitle">Host System</div>

            <div class="cpu-stats-row">
                <span class="cpu-stat-item">Max: <span class="cpu-stat-value" id="cpuGroupTemp">--</span>°C</span>
                <span class="cpu-stat-item">PWM: <span class="cpu-stat-value" id="cpuGroupPwm">--</span>%</span>
            </div>

            <div class="cpu-socket-list" id="cpuSocketList">
                <!-- Populated by JS -->
            </div>

            <div class="profile-toggle">
                <button class="profile-toggle-btn" onclick="toggleProfile('cpu')">
                    <span class="profile-toggle-icon" id="toggle-icon-cpu">▶</span>
                    Fan Profile
                    <span class="profile-coords" id="coords-cpu"></span>
                </button>
            </div>
            <div class="profile-section" id="profile-section-cpu">
                <div class="profile-canvas-container">
                    <canvas id="canvas-cpu" class="profile-canvas" width="400" height="150"></canvas>
                </div>
                <div class="profile-controls">
                    <span class="profile-status" id="cpuProfileStatus"></span>
                    <button class="profile-btn" onclick="confirmApplyGroupProfile('cpu')">Apply</button>
                </div>
            </div>

            <div class="last-seen" id="cpuLastSeen">
                Host System
            </div>
        </div>

        <!-- GPU Cards Container -->
        <div id="gpuCards">
            <div class="no-data">Waiting for GPU data...</div>
        </div>
    </div>

    <!-- Confirm Dialog -->
    <div class="confirm-overlay" id="confirmOverlay">
        <div class="confirm-dialog">
            <h3 id="confirmTitle">Confirm Action</h3>
            <p id="confirmMessage">Are you sure?</p>
            <div class="confirm-buttons">
                <button class="confirm-btn no" id="confirmCancel">Cancel</button>
                <button class="confirm-btn yes" id="confirmOk">OK</button>
            </div>
        </div>
    </div>

    <script src="/static/app.js?v=2"></script>
</body>
</html>
